<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 290" width="980" height="290" role="img" aria-label="Five accessibility and performance features" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.5" stop-color="#8493a8"/><stop offset="1" stop-color="#334155"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#c58a0b"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2740"/><stop offset="1" stop-color="#0b1220"/></linearGradient></defs><rect width="980" height="290" rx="18" fill="#05080f"/>
<text x="490" y="28" text-anchor="middle" font-size="11" fill="#7c8db5" letter-spacing="7" font-family="Segoe UI, Helvetica, Arial, sans-serif">THE SILENT ALARMS</text><rect x="20" y="44" width="176" height="220" rx="14" transform="translate(7,9)" fill="#7dd3fc" opacity="0.2"/><rect x="20" y="44" width="176" height="220" rx="14" fill="url(#panel)" stroke="#7dd3fc" stroke-width="2"/><g transform="translate(108,118)"><rect x="-36" y="-22" width="72" height="46" rx="9" fill="url(#steel)" stroke="#0b1220" stroke-width="3"/><text x="0" y="6" text-anchor="middle" font-size="15" font-weight="900" fill="#0b1220" font-family="Consolas, Menlo, 'Courier New', monospace">Enter</text><rect x="-44" y="-30" width="88" height="62" rx="14" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-dasharray="6 5"><animate attributeName="stroke-opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></rect></g><text x="108" y="190" text-anchor="middle" font-size="13" font-weight="900" fill="#7dd3fc" letter-spacing="2" font-family="Segoe UI, Helvetica, Arial, sans-serif">KEYBOARD</text><text x="108" y="214" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif">Unlock is keyboard operable</text><text x="108" y="232" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif">with a visible focus</text><rect x="214" y="44" width="176" height="220" rx="14" transform="translate(7,9)" fill="#c4b5fd" opacity="0.2"/><rect x="214" y="44" width="176" height="220" rx="14" fill="url(#panel)" stroke="#c4b5fd" stroke-width="2"/><g transform="translate(302,118)"><clipPath id="ty"><rect x="-44" y="-20" width="0" height="40"><animate attributeName="width" values="0;88;88;0" keyTimes="0;0.5;0.9;1" dur="4s" repeatCount="indefinite"/></rect></clipPath><path d="M-50 -28 h100 a10 10 0 0 1 10 10 v30 a10 10 0 0 1 -10 10 h-70 l-14 14 v-14 h-16 a10 10 0 0 1 -10 -10 v-30 a10 10 0 0 1 10 -10z" fill="#101a30" stroke="#c4b5fd" stroke-width="3"/><g clip-path="url(#ty)"><text x="-44" y="5" font-size="13" fill="#e9d5ff" font-family="Consolas, Menlo, 'Courier New', monospace">Vault unlocked</text></g></g><text x="302" y="190" text-anchor="middle" font-size="13" font-weight="900" fill="#c4b5fd" letter-spacing="2" font-family="Segoe UI, Helvetica, Arial, sans-serif">LIVE REGION</text><text x="302" y="214" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif">The result is announced</text><text x="302" y="232" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif">through a live region</text><rect x="408" y="44" width="176" height="220" rx="14" transform="translate(7,9)" fill="#f5c451" opacity="0.2"/><rect x="408" y="44" width="176" height="220" rx="14" fill="url(#panel)" stroke="#f5c451" stroke-width="2"/><g transform="translate(496,118)"><rect x="-38" y="-18" width="76" height="36" rx="18" fill="#0b1220" stroke="#f5c451" stroke-width="3"/><circle cx="-20" cy="0" r="12" fill="url(#gold)"><animate attributeName="cx" values="-20;20;20;-20" keyTimes="0;0.4;0.8;1" dur="4s" repeatCount="indefinite"/></circle></g><text x="496" y="190" text-anchor="middle" font-size="13" font-weight="900" fill="#f5c451" letter-spacing="2" font-family="Segoe UI, Helvetica, Arial, sans-serif">REDUCED MOTION</text><text x="496" y="214" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif">Static background, intro</text><text x="496" y="232" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif">reduced to simple fades</text><rect x="602" y="44" width="176" height="220" rx="14" transform="translate(7,9)" fill="#4ade80" opacity="0.2"/><rect x="602" y="44" width="176" height="220" rx="14" fill="url(#panel)" stroke="#4ade80" stroke-width="2"/><g transform="translate(690,118)"><ellipse cx="0" cy="0" rx="42" ry="22" fill="#0b1220" stroke="#4ade80" stroke-width="3"/><circle cx="0" cy="0" r="12" fill="#4ade80"><animate attributeName="r" values="12;1;12" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/></circle><rect x="-44" y="-24" width="88" height="0" fill="#0b1220"><animate attributeName="height" values="0;24;0" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/></rect></g><text x="690" y="190" text-anchor="middle" font-size="13" font-weight="900" fill="#4ade80" letter-spacing="2" font-family="Segoe UI, Helvetica, Arial, sans-serif">TAB HIDDEN</text><text x="690" y="214" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif">The animation loop stops</text><text x="690" y="232" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif">when the tab is hidden</text><rect x="796" y="44" width="176" height="220" rx="14" transform="translate(7,9)" fill="#fb7185" opacity="0.2"/><rect x="796" y="44" width="176" height="220" rx="14" fill="url(#panel)" stroke="#fb7185" stroke-width="2"/><g transform="translate(884,118)"><rect x="-50" y="-18" width="14" height="14" fill="#fb7185" stroke="#fb7185" stroke-opacity="0.4"/><rect x="-36" y="-18" width="14" height="14" fill="#0b1220" stroke="#fb7185" stroke-opacity="0.4"/><rect x="-50" y="-4" width="14" height="14" fill="#0b1220" stroke="#fb7185" stroke-opacity="0.4"/><rect x="-36" y="-4" width="14" height="14" fill="#fb7185" stroke="#fb7185" stroke-opacity="0.4"/><rect x="-50" y="10" width="14" height="14" fill="#fb7185" stroke="#fb7185" stroke-opacity="0.4"/><rect x="-36" y="10" width="14" height="14" fill="#0b1220" stroke="#fb7185" stroke-opacity="0.4"/><rect x="12" y="-18" width="7" height="7" fill="#fb7185" stroke="#fb7185" stroke-opacity="0.4"/><rect x="19" y="-18" width="7" height="7" fill="#0b1220" stroke="#fb7185" stroke-opacity="0.4"/><rect x="26" y="-18" width="7" height="7" fill="#fb7185" stroke="#fb7185" stroke-opacity="0.4"/><rect x="33"