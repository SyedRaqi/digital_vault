<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Where data goes: face matching stays local, the Ask feature sends a question and snippets to Groq" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2e8f0"/><stop offset="0.5" stop-color="#8493a8"/><stop offset="1" stop-color="#334155"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#c58a0b"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2740"/><stop offset="1" stop-color="#0b1220"/></linearGradient></defs><rect width="1000" height="340" rx="18" fill="#05080f"/>
<rect x="40" y="44" width="500" height="262" rx="14" transform="translate(7,9)" fill="#4ade80" opacity="0.2"/><rect x="40" y="44" width="500" height="262" rx="14" fill="url(#panel)" stroke="#4ade80" stroke-width="2"/>
<text x="64" y="76" font-size="12" font-weight="900" fill="#4ade80" letter-spacing="3" font-family="Segoe UI, Helvetica, Arial, sans-serif">YOUR WINDOWS PC</text><text x="64" y="104" font-size="14" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif">Face matching runs locally.</text>
<rect x="64" y="132" width="212" height="40" rx="10" fill="#0b1220" stroke="#4ade80" stroke-opacity="0.7"/><text x="170" y="157" text-anchor="middle" font-size="12.5" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif">Your files and folders</text><rect x="290" y="132" width="212" height="40" rx="10" fill="#0b1220" stroke="#4ade80" stroke-opacity="0.7"/><text x="396" y="157" text-anchor="middle" font-size="12.5" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif">Face enrollment</text><rect x="64" y="190" width="212" height="40" rx="10" fill="#0b1220" stroke="#4ade80" stroke-opacity="0.7"/><text x="170" y="215" text-anchor="middle" font-size="12.5" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif">Face matching · OpenCV SFace</text><rect x="290" y="190" width="212" height="40" rx="10" fill="#0b1220" stroke="#4ade80" stroke-opacity="0.7"/><text x="396" y="215" text-anchor="middle" font-size="12.5" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif">In-place encryption</text>
<text x="64" y="268" font-size="12.5" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif">The static landing page can't reach any of this.</text>
<g transform="translate(486,92)"><g transform="translate(-19.2,-21.76) scale(0.32)"><path d="M60 8 L108 26 V70 C108 100 86 122 60 130 C34 122 12 100 12 70 V26 Z" fill="#0f1a2e" stroke="#4ade80" stroke-width="4"/></g><g transform="translate(0,1) scale(0.4)"><circle cx="0" cy="-4" r="9" fill="#4ade80"/><polygon points="-5,2 5,2 8,24 -8,24" fill="#4ade80"/></g></g>
<path d="M790 178 a34 34 0 0 1 8 -66 a46 46 0 0 1 88 -10 a38 38 0 0 1 60 36 a30 30 0 0 1 -6 40 z" fill="#101a30" stroke="#fb923c" stroke-width="3"/><text x="860" y="150" text-anchor="middle" font-size="22" font-weight="900" fill="#fdba74" letter-spacing="3" font-family="Segoe UI, Helvetica, Arial, sans-serif">GROQ</text><text x="860" y="170" text-anchor="middle" font-size="10.5" fill="#fdba74" letter-spacing="2" font-family="Segoe UI, Helvetica, Arial, sans-serif">CLOUD</text>
<text x="650" y="136" text-anchor="middle" font-size="12" font-weight="900" fill="#fdba74" letter-spacing="2" font-family="Segoe UI, Helvetica, Arial, sans-serif">ASK FEATURE</text>
<path id="ask" d="M550 150 H760" stroke="#fb923c" stroke-width="3" fill="none"/><polygon points="760,143 772,150 760,157" fill="#fb923c"/>
<text x="650" y="176" text-anchor="middle" font-size="11" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif">question + retrieved snippets</text>
<circle r="5" fill="#fff"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#ask"/></animateMotion></circle>
<path id="bk" d="M550 238 H760" stroke="#fb923c" stroke-width="3" stroke-dasharray="5 7" fill="none"/><polygon points="760,231 772,238 760,245" fill="#fb923c" opacity="0.7"/>
<text x="650" y="224" text-anchor="middle" font-size="11" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif">configured Groq backup</text><text x="650" y="262" text-anchor="middle" font-size="10.5" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif">optional</text>
<text x="500" y="326" text-anchor="middle" font-size="11" fill="#64748b" letter-spacing="3" font-family="Segoe UI, Helvetica, Arial, sans-serif">ASK SENDS DATA OFF YOUR PC ONLY WHEN YOU USE IT</text></svg>