<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 136" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Digital Vault</title>
  <desc id="logo-desc">A geometric shield enclosing a vault dial and keyhole, beside the DIGITAL_VAULT wordmark.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a42"/><stop offset="1" stop-color="#8a8a94"/>
    </linearGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f1f3"/><stop offset="1" stop-color="#a9a9b0"/>
    </linearGradient>
    <symbol id="vault-icon" viewBox="0 0 120 136">
      <path d="M60 5 109 32v43c0 28-21 45-49 56C32 120 11 103 11 75V32L60 5Z" fill="none" stroke="url(#metal)" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="60" cy="65" r="31" fill="none" stroke="url(#metal)" stroke-width="2"/>
      <circle cx="60" cy="65" r="23" fill="none" stroke="url(#metal)" stroke-width="2"/>
      <path d="M60 34v8M91 65h-8M60 96v-8M29 65h8" fill="none" stroke="url(#metal)" stroke-width="2" stroke-linecap="round"/>
      <path d="M60 52a8 8 0 0 0-4.5 14.6V78h9V66.6A8 8 0 0 0 60 52Z" fill="#c9a96a"/>
    </symbol>
    <symbol id="vault-icon-mono" viewBox="0 0 120 136">
      <path d="M60 5 109 32v43c0 28-21 45-49 56C32 120 11 103 11 75V32L60 5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="60" cy="65" r="31" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="60" cy="65" r="23" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M60 34v8M91 65h-8M60 96v-8M29 65h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M60 52a8 8 0 0 0-4.5 14.6V78h9V66.6A8 8 0 0 0 60 52Z" fill="currentColor"/>
    </symbol>
  </defs>
  <!-- Horizontal lockup. The icon-only and mono variants are reusable symbols above. -->
  <use href="#vault-icon" x="0" y="0" width="120" height="136"/>
  <g aria-hidden="true" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" letter-spacing="5.2">
    <text x="144" y="77" fill="url(#metal)">DIGITAL<tspan fill="#c9a96a">_</tspan>VAULT</text>
  </g>
</svg>
